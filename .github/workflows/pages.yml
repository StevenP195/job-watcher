name: Publish site

on:
  push:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # include the data commit the daily run just pushed
      - name: Assemble site (pages, assets, and the two data files)
        run: |
          mkdir -p _site/data
          cp index.html browse.html market.html news.html manifest.webmanifest sw.js _site/
          cp -r assets _site/
          cp data/history.csv data/status.json _site/data/
          cp data/news.json _site/data/ 2>/dev/null || echo '{"items":[],"companies":[],"updated":"","window_days":21}' > _site/data/news.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
